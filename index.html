<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>あそび ひろば</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial Rounded MT Bold', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: #fff;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1.2vh;
            min-height: 6px;
            background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
            z-index: 2;
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6vh 8vw;
        }

        .icon {
            font-size: 14vh;
            line-height: 1.2;
            margin-bottom: 1.5vh;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-2vh); }
        }

        .title {
            font-size: 7vh;
            font-weight: bold;
            background: linear-gradient(135deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 3s ease infinite;
            margin-bottom: 1.2vh;
            text-align: center;
            line-height: 1.2;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .subtitle {
            font-size: 2.8vh;
            color: #888;
            margin-bottom: 5vh;
            text-align: center;
        }

        .game-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 2.5vh;
            align-items: center;
        }

        .game-btn {
            font-size: 4vh;
            font-weight: bold;
            padding: 2.2vh 0;
            border: none;
            border-radius: 100px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            letter-spacing: 3px;
            width: 70vw;
            max-width: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.5vw;
            text-decoration: none;
        }

        .game-btn:hover {
            transform: translateY(-3px) scale(1.05);
        }

        .game-btn:active {
            transform: translateY(0) scale(0.98);
        }

        .game-btn .btn-icon {
            font-size: 5vh;
        }

        .game-btn.color1 {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            box-shadow: 0 1.5vh 4vh rgba(238, 90, 36, 0.4);
        }
        .game-btn.color1:hover {
            box-shadow: 0 2vh 5vh rgba(238, 90, 36, 0.5);
        }

        .game-btn.color2 {
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            box-shadow: 0 1.5vh 4vh rgba(108, 92, 231, 0.4);
        }
        .game-btn.color2:hover {
            box-shadow: 0 2vh 5vh rgba(108, 92, 231, 0.5);
        }

        .game-btn.color3 {
            background: linear-gradient(135deg, #00b894, #00cec9);
            box-shadow: 0 1.5vh 4vh rgba(0, 184, 148, 0.4);
        }
        .game-btn.color3:hover {
            box-shadow: 0 2vh 5vh rgba(0, 184, 148, 0.5);
        }

        .game-btn.color4 {
            background: linear-gradient(135deg, #fd79a8, #e84393);
            box-shadow: 0 1.5vh 4vh rgba(232, 67, 147, 0.4);
        }
        .game-btn.color4:hover {
            box-shadow: 0 2vh 5vh rgba(232, 67, 147, 0.5);
        }

        .coming-soon {
            font-size: 2.4vh;
            color: #b2bec3;
            text-align: center;
            margin-top: 2vh;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="main">
        <div class="icon">🎮</div>
        <div class="title">あそび ひろば</div>
        <div class="subtitle">あそびたい げーむ を えらんでね！</div>

        <div class="game-list">
            <a class="game-btn color1" href="game1.html">
                <span class="btn-icon">🧮</span> けいさん チャレンジ
            </a>
            <!-- 今後追加するゲームはここに並べる -->
            <!--
            <a class="game-btn color2" href="game2.html">
                <span class="btn-icon">🎯</span> ゲーム名 2
            </a>
            <a class="game-btn color3" href="game3.html">
                <span class="btn-icon">🧩</span> ゲーム名 3
            </a>
            -->
        </div>

        <div class="coming-soon">✨ もっと げーむ が ふえるよ ✨</div>
    </div>
</div>
</body>
</html>
